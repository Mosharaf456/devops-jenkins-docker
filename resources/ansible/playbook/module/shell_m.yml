- hosts: dev
  gather_facts: no
  tasks:
    - name: Copy a file with specific content
      ansible.builtin.copy:
        dest: /tmp/test.log
        content: |
          hello
          line2
          line3
        owner: root
        group: root
        mode: '0644'
    - name: Read content of /tmp/test.log
      ansible.builtin.slurp:
        src: /tmp/test.log
      register: log_content

    - name: Show log file content
      ansible.builtin.debug:
        msg: "{{ log_content['content'] | b64decode }}"

    - name: Check if a file exists
      ansible.builtin.stat:
        path: /tmp/test.log
      register: file_status

    - name: Show file existence status
      ansible.builtin.debug:
        msg: "File exists!"
      when: file_status.stat.exists

    
