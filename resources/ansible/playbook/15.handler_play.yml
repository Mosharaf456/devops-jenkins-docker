# make a handler that will restart the httpd service when the web content is copied to the server.

---
- hosts: dev
  tasks:
    - name: copy dem.conf file to apache2 conf.d directory
      copy:
        src: /etc/ansible/files/demo.conf
        dest: /etc/httpd/conf.d/demo.conf
      notify: 
        - restart_apache2 
        - restart_mysql
  handlers:
    - name: restart_apache2
      service:
        name: apache2
        state: restarted
    - name: restart_mysql 
      service:
        name: mariadb 
        state: restarted



