[all:vars]
ansible_connection = ssh

[dev]
client1 ansible_host=192.168.1.101 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' ansible_ssh_private_key_file=/tmp/ansible/remote-key

client2 ansible_host=192.168.1.102 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' ansible_ssh_private_key_file=/tmp/ansible/remote-key

